name: CI
on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:

jobs:
  syntax_and_build:
    name: Format, vet, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3.1.0
      - name: Setup Golang
        uses: actions/setup-go@c4a742cab115ed795e34d4513e2cf7d472deb55f # v3.3.1
        with:
          # go.mod's own `go`/`toolchain` directives (go 1.25, toolchain
          # go1.26.6) are authoritative — go.mod's `toolchain` line pins a
          # specific patched release for known CVEs, and this reads it
          # directly rather than hardcoding a version here that could drift
          # out of sync with it.
          go-version-file: go.mod
      - name: Check gofmt (syntax/style)
        run: ./scripts/gofmtcheck.sh
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        # Pinned by version (not @latest) for deterministic, reproducible
        # CI runs — a tool update should be a deliberate diff, not a
        # silent change in what "passing CI" means.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.0
          staticcheck ./...
      - name: govulncheck
        # Scans this module's actual call graph for known-vulnerable
        # dependency code paths (not just "is a vulnerable version listed",
        # which would also flag vulnerabilities in code this provider never
        # reaches). Also pinned by version for the same reason as
        # staticcheck above.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Build
        env:
          # Must be outside the checked-out working tree: the Makefile's
          # `$(GOPATH)/bin/...` lookup needs GOPATH set to a known location,
          # but pointing it at github.workspace (the repo checkout itself)
          # put the module cache at go/pkg/mod inside the repo — which a
          # later `go test ./...`, run from the same directory, then tried
          # to treat as part of this module's own source tree.
          GOPATH: ${{ runner.temp }}/go
          LOCAL: true
        run: make build-only
      - name: Test
        env:
          LOCAL: true
        run: go test ./...
      - name: Test (race detector)
        env:
          LOCAL: true
          CGO_ENABLED: 1
        run: go test -race ./...
      - name: Setup Terraform (for integration tests)
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Integration tests (mock-backed Terraform lifecycle)
        # TestIntegrationGCPConnectorLifecycle, TestIntegrationAssetGroupLifecycle
        # and TestIntegrationWASOptionProfileLifecycle each drive a real
        # terraform binary and this provider's real binary over the real
        # plugin protocol against an in-memory mock Qualys API (see
        # provider/*_integration_test.go) — proving Terraform/provider
        # lifecycle behaviour, not live Qualys API compatibility (see
        # README.md's Testing section). They are gated on TF_ACC=1 purely to
        # avoid ever running unintentionally in the plain `go test ./...`
        # step above, not because they need real credentials — the "Test"
        # step above does not set TF_ACC, so it always skips them, which is
        # why this step exists: without it, nothing in this workflow would
        # ever actually execute them. -run scopes to exactly these three, and
        # explicitly checking for a "--- PASS" line per test (rather than
        # trusting the step's own exit code alone) makes a future change that
        # silently skips or removes one of them fail CI loudly instead of
        # quietly passing.
        env:
          LOCAL: true
          TF_ACC: '1'
        run: |
          tests="TestIntegrationGCPConnectorLifecycle TestIntegrationAssetGroupLifecycle TestIntegrationWASOptionProfileLifecycle"
          pattern=$(echo "$tests" | tr ' ' '|')

          set +e
          go test ./provider/... -run "^(${pattern})\$" -v 2>&1 | tee /tmp/integration-test.log
          status=${PIPESTATUS[0]}
          set -e

          for t in $tests; do
            if ! grep -q -- "--- PASS: ${t}" /tmp/integration-test.log; then
              echo "::error::${t} did not report PASS in the integration test log above"
              status=1
            fi
          done
          exit "$status"
  release:
    if: startsWith(github.ref, 'refs/tags')
    needs: [ syntax_and_build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3.1.0
      - name: Setup Golang
        uses: actions/setup-go@c4a742cab115ed795e34d4513e2cf7d472deb55f # v3.3.1
        with:
          go-version-file: go.mod # matches syntax_and_build; see its comment above
      - name: Release
        run: scripts/goreleaser.sh