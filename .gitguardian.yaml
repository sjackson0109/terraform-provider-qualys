# GitGuardian secret-scanning configuration.
#
# provider/acctest_helpers_test.go sets QUALYS_USERNAME/QUALYS_PASSWORD
# environment variables to the literal placeholder string "acctest" so
# that Terraform lifecycle integration tests can point this provider at a
# purely local, in-memory httptest mock server (see that file's own doc
# comment, and resource_gcp_connector_integration_test.go /
# resource_asset_group_integration_test.go /
# resource_was_option_profile_integration_test.go, which use it). This is
# not a real credential: it is never sent to any real Qualys endpoint, has
# no relationship to any real Qualys account, and the mock server it
# authenticates against exists only for the duration of a single test
# process. GitGuardian's generic credential-shaped-key-name detector flags
# it regardless, since it matches on the QUALYS_PASSWORD key name plus a
# hardcoded string value rather than on whether the value is a real
# secret.
#
# Genuine credentials in this repository (README/docs examples,
# .tf files) already use variable references or environment-variable
# placeholders, never literal values, and are not exempted here.
paths-ignore:
  - provider/acctest_helpers_test.go
